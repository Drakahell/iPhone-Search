# Подписанная сборка и выгрузка в TestFlight — пользователи ставят приложение по ссылке.
# Запуск: вкладка Actions → TestFlight → Run workflow.
# Что нужно настроить один раз — docs/DISTRIBUTION.md.
name: TestFlight

on:
  workflow_dispatch:

jobs:
  upload:
    name: Сборка и выгрузка в TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEY_CONTENT: ${{ secrets.ASC_PRIVATE_KEY }}
      BUNDLE_ID_PREFIX: ${{ vars.BUNDLE_ID_PREFIX }}
    steps:
      - name: Проверить настройки
        run: |
          missing=""
          [ -z "$TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$KEY_CONTENT" ] && missing="$missing ASC_PRIVATE_KEY"
          [ -z "$BUNDLE_ID_PREFIX" ] && missing="$missing BUNDLE_ID_PREFIX(переменная)"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы:$missing. Инструкция: docs/DISTRIBUTION.md"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Сгенерировать Xcode-проект
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Подготовить ключ App Store Connect
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY_CONTENT" > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Архив (подпись выполняется автоматически)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project CircleSearch.xcodeproj \
            -scheme CircleSearch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CircleSearch.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            BUNDLE_ID_PREFIX="$BUNDLE_ID_PREFIX" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee archive.log

      - name: Выгрузить в TestFlight
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/CircleSearch.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | tee export.log

      - name: Показать ошибки
        if: failure()
        run: |
          for f in archive.log export.log; do
            [ -f "$f" ] && python3 .github/scripts/annotate_errors.py "$f"
          done
          true

      - name: Удалить ключ
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
