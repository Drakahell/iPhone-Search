# Генерация Xcode-проекта:  brew install xcodegen && xcodegen generate
name: CircleSearch

options:
  bundleIdPrefix: com.example.circlesearch
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""          # <- Team ID (в CI передаётся из секретов)
    # Единственное место, где задаётся идентификатор приложения.
    # Для App Store он должен быть уникальным, например com.ваше-имя.circlesearch.
    BUNDLE_ID_PREFIX: com.example.circlesearch
    APP_GROUP_ID: group.$(BUNDLE_ID_PREFIX)

targets:
  # ── Общая библиотека: вся логика, UI и анимации ──────────────────────────
  CircleSearchKit:
    type: framework
    platform: iOS
    sources: [Kit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kit
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES   # можно использовать и в расширениях

  # ── Основное приложение ─────────────────────────────────────────────────
  CircleSearch:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
    dependencies:
      - target: CircleSearchKit
      - target: CircleSearchShare
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Обвести и найти
        UILaunchScreen: {}
        UIStatusBarHidden: false
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID_PREFIX)
            CFBundleURLSchemes: [circlesearch]
        NSPhotoLibraryUsageDescription: Доступ нужен, чтобы сразу открывать только что сделанный скриншот.
        AppGroupID: $(APP_GROUP_ID)
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/CircleSearch.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # ── Share Extension: «Поделиться → Обвести и найти» из редактора скриншотов ──
  CircleSearchShare:
    type: app-extension
    platform: iOS
    sources: [Extensions/ShareExtension]
    dependencies:
      - target: CircleSearchKit
        embed: false
    info:
      path: Extensions/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Обвести и найти
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: Extensions/ShareExtension/CircleSearchShare.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).share
        # Расширение лежит в CircleSearch.app/PlugIns/ — фреймворк ищем в Frameworks приложения.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  # ── Тесты ───────────────────────────────────────────────────────────────
  # (схема со сборкой и тестами описана в секции schemes ниже)
  CircleSearchKitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/CircleSearchKitTests]
    dependencies:
      - target: CircleSearchKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CircleSearch:
    build:
      targets:
        CircleSearch: all
        CircleSearchKit: all
        CircleSearchShare: all
    test:
      targets: [CircleSearchKitTests]
      gatherCoverageData: true
